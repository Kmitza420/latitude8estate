# latitude8estate — full stack.
#
# `web/ui` is a *static* Astro build: it reads the API at build time and bakes
# the result into HTML. So the API has to be running and populated before the
# UI image is built, and the order is:
#
#   docker compose up -d postgres minio minio_init
#   python -m scripts.seed                 # creates the schema, seeds content
#   docker compose up -d --build web_api
#   docker compose up -d --build web_ui    # build reaches web_api on the host
#
# `docker compose up --build` in one shot will build web_ui before web_api is
# listening, and the UI build fails rather than silently publishing an empty
# site — there is no fixture fallback in the UI any more, by design.

services:
  postgres:
    image: postgres:15-alpine
    container_name: latitude8estate_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: latitude8estate_db
    ports:
      - "5432:5432"
    volumes:
      - latitude8estate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: latitude8estate_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - latitude8estate_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the public media bucket and makes it anonymously readable, so the
  # URLs the API hands out actually resolve in a browser. A fresh MinIO bucket
  # is private, and every image would 403 without this.
  minio_init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: latitude8estate_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/latitude8estate-media &&
      mc anonymous set download local/latitude8estate-media &&
      mc mb --ignore-existing local/latitude8estate-files &&
      echo 'minio buckets ready'
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: latitude8estate_redis
    environment:
      TZ: Europe/Zagreb
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm_api:
    build:
      # Still built from ./crm/api — it is a stub that imports nothing from
      # core/ yet. It will need the repository-root context that web/api uses
      # the moment it does.
      context: ./crm/api/
      dockerfile: Dockerfile
    container_name: latitude8estate_crm_api
    environment:
      # These names must match the fields on core.settings.Settings. Anything
      # else is ignored silently (extra="ignore"), which looks like it is
      # configured when it is not — the previous DATABASE_URL / MINIO_ROOT_USER
      # values were all being dropped, leaving every setting on its localhost
      # default.
      ENVIRONMENT: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: latitude8estate_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_PUBLIC_BUCKET: latitude8estate-media
      MINIO_PUBLIC_BASE_URL: http://localhost:9000/latitude8estate-media
      CORS_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  web_api:
    build:
      context: .
      dockerfile: web/api/Dockerfile
    container_name: latitude8estate_web_api
    environment:
      ENVIRONMENT: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: latitude8estate_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_PUBLIC_BUCKET: latitude8estate-media
      # The base a *browser* uses, not the one the API uses. MinIO is
      # `minio:9000` inside the compose network and `localhost:9000` outside
      # it, and the URLs in a response are read outside it.
      MINIO_PUBLIC_BASE_URL: http://localhost:9000/latitude8estate-media
      # The Astro dev server and the web_ui container. Never "*": it is paired
      # with allow_credentials, and in production it also feeds
      # TrustedHostMiddleware.
      CORS_ORIGINS: http://localhost:4321,http://localhost:3001
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      # /health runs a real query, so this goes red when the database goes
      # away rather than staying green while every request 500s.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  crm_ui:
    build:
      context: ./crm/ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: latitude8estate_crm_ui
    ports:
      - "3000:80"
    depends_on:
      - crm_api

  web_ui:
    build:
      context: ./web/ui
      dockerfile: Dockerfile
      # The static build fetches from the API. `network: host` lets it reach
      # the port web_api publishes on the host, since compose service names do
      # not resolve during a build.
      network: host
      args:
        PUBLIC_API_BASE_URL: http://localhost:8001
    container_name: latitude8estate_web_ui
    ports:
      - "3001:80"
    depends_on:
      - web_api

volumes:
  latitude8estate_postgres_data:
  latitude8estate_minio_data:
