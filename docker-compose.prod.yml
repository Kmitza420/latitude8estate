# Production overrides for a single VPS.
# Use explicitly:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml ...

services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"

  minio:
    ports: !override
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  minio_init:
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/latitude8estate-media &&
      mc anonymous set download local/latitude8estate-media &&
      mc mb --ignore-existing local/latitude8estate-files &&
      echo 'minio buckets ready'
      "

  web_api:
    ports: !override
      - "127.0.0.1:8001:8000"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AUTH_JWT_SECRET_KEY: ${AUTH_JWT_SECRET_KEY}
      MINIO_PUBLIC_BASE_URL: ${PUBLIC_SITE_ORIGIN}/media
      CORS_ORIGINS: ${PUBLIC_SITE_ORIGIN},${PUBLIC_API_ORIGIN}
    restart: unless-stopped

  web_ui:
    ports: !override
      - "127.0.0.1:3001:80"
    build:
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_ORIGIN}
        PUBLIC_API_FORMS_ENABLED: "false"
    restart: unless-stopped

  crm_api:
    profiles: ["crm"]
    restart: unless-stopped

  crm_ui:
    profiles: ["crm"]
    restart: unless-stopped
