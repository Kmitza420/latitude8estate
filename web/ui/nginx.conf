server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The container publishes on a different host port than it listens on
    # (3001 -> 80), and nginx builds absolute redirects from its own
    # $server_port. Left on, a request for /home is answered with
    # `Location: http://localhost/home/` — the wrong port, and a dead end for
    # every page on the site. Relative redirects carry the browser's own
    # origin instead.
    absolute_redirect off;

    # Astro's static build emits directories (`/projects/index.html`), so
    # `$uri/index.html` is what actually serves a page — and serving it
    # directly avoids the redirect hop that `$uri/` would cost. `$uri.html`
    # covers any route emitted as a flat file. A miss falls through to the
    # site's own 404 page rather than nginx's default one.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Fingerprinted build assets are safe to cache hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
