server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro's static build emits directories (`/projects/index.html`), so
    # `$uri/` covers most routes; `$uri.html` covers any it emits as a flat
    # file. A miss falls through to the site's own 404 page rather than
    # nginx's default one.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Fingerprinted build assets are safe to cache hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
